name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check VERSION is in sync (script.js / sw.js / index.html)
        run: npm run check:version-sync

      - name: Rebuild tailwind.css and fail if it's out of date
        run: |
          npm run build:css
          git diff --exit-code -- tailwind.css || (echo "::error::tailwind.css is out of date - run 'npm run build:css' and commit the result." && exit 1)
